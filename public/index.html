<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Task Manager - DevOps Lab</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container">
    <header>
      <div class="header-content">
        <h1>⚙️ Student Task Manager</h1>
        <p class="subtitle">DevOps for Scalable Systems Lab · Live Application</p>
      </div>
      <div class="metrics-badge">
        <a href="/metrics" target="_blank" class="btn-metrics">📊 View Metrics</a>
      </div>
    </header>

    <main>
      <section class="task-form-card">
        <h2>Add New Task</h2>
        <form id="taskForm">
          <input type="text" id="taskTitle" placeholder="Enter task title (e.g. Build Docker Image)" required>
          <select id="taskPriority">
            <option value="Normal">Priority: Normal</option>
            <option value="Medium">Priority: Medium</option>
            <option value="High">Priority: High</option>
            <option value="Urgent">Priority: Urgent</option>
          </select>
          <button type="submit" class="btn-primary">Add Task</button>
        </form>
      </section>

      <section class="task-list-section">
        <div class="section-header">
          <h2>Task Overview</h2>
          <span id="taskCount" class="badge">0 Tasks</span>
        </div>
        <div id="taskList" class="task-grid">
          <!-- Tasks dynamically rendered here -->
        </div>
      </section>
    </main>

    <footer>
      <p>DevOps for Scalable Systems Lab · Practical Application Record</p>
    </footer>
  </div>
  <script src="script.js"></script>
</body>
</html>
